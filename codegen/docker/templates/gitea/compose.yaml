# Generated from codegen/specs/raw/manifest.json. Do not edit.
name: __PROJECT_NAME__

services:
  gitea:
    image: __CONTAINER_IMAGE__
    environment:
      GITEA__actions__ENABLED: "false"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__mailer__ENABLED: "false"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: gitea
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__server__SSH_DOMAIN: gitea
      GITEA__server__SSH_PORT: "22"
      GITEA__service__DISABLE_REGISTRATION: "true"
      USER_GID: "1000"
      USER_UID: "1000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
            token=$$(cat /results/api-token 2>/dev/null) &&
            wget -qO- --header="Authorization: token $$token"
            http://127.0.0.1:3000/api/v1/user >/dev/null
      interval: 2s
      timeout: 2s
      retries: 90
      start_period: 5s
    post_start:
      - command: ["/bin/sh", "/sandbox/bootstrap.sh"]
        user: "1000:1000"
    restart: "no"
    stop_grace_period: 10s
    tmpfs:
      - /data:mode=0750,uid=1000,gid=1000
    volumes:
      - ./bootstrap.sh:/sandbox/bootstrap.sh:ro
      - ./results:/results
